name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout
        uses: actions/checkout@v4

      # 2. تهيئة Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. تهيئة Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. التحقق من مسارات وملفات المشروع (الخطوة المُصلّحة)
      - name: Verify project paths
        shell: bash
        run: |
          fail=0

          check() {
            if eval "$2"; then
              echo "✅ PASS: $1"
            else
              echo "❌ FAIL: $1"
              fail=1
            fi
          }

          # --- التحقق من وجود ملف lz-string ---
          check "lz-string file exists"         "test -f app/src/main/assets/lib/lz-string.min.js"

          # --- التحقق من AndroidManifest.xml ---
          check "no package attr in Manifest"   "! grep -q 'package=\"' app/src/main/AndroidManifest.xml"

          # --- التحقق من build.gradle ---
          check "namespace in build.gradle"     "grep -q \"namespace 'com.fabrics.app'\" app/build.gradle"
          check "applicationId in build.gradle" "grep -q \"applicationId 'com.fabrics.app'\" app/build.gradle"

          # --- التحقق من index.html ---
          check "AndroidPrint.printHtml"        "grep -q 'AndroidPrint.printHtml' app/src/main/assets/index.html"
          check "AndroidShare.shareFile"        "grep -q 'AndroidShare.shareFile' app/src/main/assets/index.html"
          check "AndroidShare.shareText"        "grep -q 'AndroidShare.shareText' app/src/main/assets/index.html"

          # --- إيقاف الخطوة بخطأ إذا فشل أي شرط ---
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "❌ فشل التحقق من بعض المسارات أو الملفات، راجع الرسائل أعلاه."
            exit 1
          fi

          echo ""
          echo "✅ تم التحقق من جميع المسارات بنجاح."

      # 5. بناء ملف APK
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      # 6. رفع ملف APK كـ Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
