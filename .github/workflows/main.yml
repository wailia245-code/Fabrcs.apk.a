name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Download required JavaScript libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/lib
          curl -fsSL --retry 3 --retry-delay 2 \
            https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js \
            -o app/src/main/assets/lib/html2pdf.bundle.min.js
          curl -fsSL --retry 3 --retry-delay 2 \
            https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js \
            -o app/src/main/assets/lib/lz-string.min.js
          test -s app/src/main/assets/lib/html2pdf.bundle.min.js
          test -s app/src/main/assets/lib/lz-string.min.js

      - name: Verify project paths
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/fabrics/app/MainActivity.java
          test -f app/src/main/java/com/fabrics/app/PrintBridge.java
          test -f app/src/main/java/com/fabrics/app/ShareBridge.java
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/lib/html2pdf.bundle.min.js
          test -f app/src/main/assets/lib/lz-string.min.js
          ! grep -q 'package="' app/src/main/AndroidManifest.xml
          grep -q "namespace 'com.fabrics.app'" app/build.gradle
          grep -q "applicationId 'com.fabrics.app'" app/build.gradle
          grep -q 'AndroidPrint.printHtml' app/src/main/assets/index.html
          grep -q 'AndroidShare.shareFile' app/src/main/assets/index.html
          grep -q 'AndroidShare.shareText' app/src/main/assets/index.html

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fabrics-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
